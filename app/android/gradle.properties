# Memory budget for CI.
#
# A GitHub-hosted runner has 16 GB total, and the Gradle daemon, the Kotlin
# compile daemon and the D8 dexer all run at the same time. The previous
# settings (-Xmx8G heap + 4G metaspace for Gradle alone) over-committed that
# budget once we bundled the full ~80-adapter mediation set: the D8 dexing
# phase ran for ~9 minutes and then the job was SIGTERM'd (exit code 143,
# i.e. the runner's OOM handler, not a compile error).
#
# These values leave headroom for the Kotlin daemon and D8 alongside Gradle.
# -XX:+ExitOnOutOfMemoryError makes an OOM fail loudly and immediately instead
# of thrashing until the runner kills us, and we no longer write heap dumps
# (an 8 GB dump on CI just fills the disk and hides the real error).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+ExitOnOutOfMemoryError
# Kotlin compiles in its own daemon process; cap it so it cannot starve D8.
kotlin.daemon.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m
# Fewer concurrent workers = lower peak memory while dexing many AARs.
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Gradle's VFS file watcher - it throws "Already watching path"
# exceptions on CI runners when multiple Gradle processes register the
# same path.
org.gradle.vfs.watch=false
